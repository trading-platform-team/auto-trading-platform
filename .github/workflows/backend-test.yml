name: Backend Test

on:
  pull_request:
    branches: [develop, main]
    paths: ["backend/**", ".github/workflows/backend-test.yml"]
  push:
    branches: [develop, main]
    paths: ["backend/**"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -v
