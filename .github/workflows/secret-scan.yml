name: Secret Scan

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: API 키 등 민감정보 커밋 여부 검사
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source /repo --redact -v
