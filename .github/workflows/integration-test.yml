name: Integration Test

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  compose-up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 전체 컨테이너 실행
        run: docker compose up -d --build

      - name: 컨테이너 간 통신 확인 (backend → kafka, redis, postgres, vault, ai)
        run: |
          for i in $(seq 1 30); do
            res=$(curl -s http://localhost:8000/health/deps || true)
            echo "$res"
            if echo "$res" | grep -q '"status":"ok"'; then exit 0; fi
            sleep 5
          done
          echo "의존 서비스 연결 실패"; exit 1

      - name: 시세 파이프라인 확인 (collector → kafka → backend → redis)
        run: |
          for i in $(seq 1 30); do
            res=$(curl -s http://localhost:8000/market/prices || true)
            echo "$res" | head -c 300; echo
            if echo "$res" | grep -q '"symbol"'; then exit 0; fi
            sleep 5
          done
          echo "시세 데이터가 Redis에 쌓이지 않음"; exit 1

      - name: 자동매매 엔진 확인 (전략 등록 → 조건 충족 → 모의 주문 → Postgres 저장)
        run: |
          curl -sf -X POST http://localhost:8000/strategies \
            -H "Content-Type: application/json" \
            -d '{"name":"CI 테스트 전략","symbol":"005930","side":"buy","quantity":1,"cooldown_sec":5,
                 "conditions":[{"left":{"name":"PRICE"},"op":">","right":0}]}'
          for i in $(seq 1 20); do
            res=$(curl -s http://localhost:8000/orders || true)
            echo "$res" | head -c 300; echo
            if echo "$res" | grep -q '"FILLED"'; then exit 0; fi
            sleep 3
          done
          echo "모의 주문이 실행되지 않음"; exit 1

      - name: AI 실시간 이상탐지 확인 (kafka → ai → redis → backend /anomalies)
        run: |
          for i in $(seq 1 30); do
            res=$(curl -s http://localhost:8000/anomalies || true)
            echo "$res" | head -c 400; echo
            if echo "$res" | grep -q '"anomaly"'; then exit 0; fi
            sleep 5
          done
          echo "이상탐지 경보가 생성되지 않음"; docker compose logs ai | tail -50; exit 1

      - name: 타임머신 확인 (과거 시세 → 백테스트, 직접 매매 세션 → ai 이상거래 표시)
        run: |
          curl -sf http://localhost:8000/history/symbols | grep -q '"count"'
          presets=$(curl -sf http://localhost:8000/backtest/presets)
          body=$(echo "$presets" | python3 -c "import sys,json;p=json.load(sys.stdin)[0];print(json.dumps({'symbol':'005930','start':'2024-01-02','buy_conditions':p['buy_conditions'],'sell_conditions':p['sell_conditions']}))")
          curl -sf -X POST http://localhost:8000/backtest -H "Content-Type: application/json" -d "$body" | grep -q '"total_return_pct"'
          sid=$(curl -sf -X POST http://localhost:8000/timemachine/sessions -H "Content-Type: application/json" \
                -d '{"symbol":"005380","start_date":"2024-03-04"}' | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")
          curl -sf -X POST http://localhost:8000/timemachine/sessions/$sid/order -H "Content-Type: application/json" -d '{"side":"buy","quantity":3}' > /dev/null
          curl -sf -X POST http://localhost:8000/timemachine/sessions/$sid/step -H "Content-Type: application/json" -d '{"days":30}' \
            | python3 -c "import sys,json;v=json.load(sys.stdin);print(v['date'],'anomalies',len(v['anomalies']));assert v['days_passed']==30"
          curl -sf -X POST http://localhost:8000/timemachine/sessions/$sid/finish | grep -q '"ranking"'

      - name: frontend → backend 프록시 확인
        run: curl -sf http://localhost:3000/api/health

      - name: AI 이상탐지 API 확인
        run: |
          curl -sf -X POST http://localhost:8001/detect \
            -H "Content-Type: application/json" \
            -d '{"bars":[{"timestamp":"a","price":100,"volume":1},{"timestamp":"b","price":110,"volume":1}]}' \
            | grep -q price_jump

      - name: 실패 시 로그 출력
        if: failure()
        run: docker compose logs

      - name: 정리
        if: always()
        run: docker compose down -v
