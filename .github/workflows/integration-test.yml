name: Integration Test

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  compose-up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 전체 컨테이너 실행
        run: docker compose up -d --build

      - name: 컨테이너 간 통신 확인 (backend → kafka, redis, postgres, vault, ai)
        run: |
          for i in $(seq 1 30); do
            res=$(curl -s http://localhost:8000/health/deps || true)
            echo "$res"
            if echo "$res" | grep -q '"status":"ok"'; then exit 0; fi
            sleep 5
          done
          echo "의존 서비스 연결 실패"; exit 1

      - name: 시세 파이프라인 확인 (collector → kafka → backend → redis)
        run: |
          for i in $(seq 1 30); do
            res=$(curl -s http://localhost:8000/market/prices || true)
            echo "$res" | head -c 300; echo
            if echo "$res" | grep -q '"symbol"'; then exit 0; fi
            sleep 5
          done
          echo "시세 데이터가 Redis에 쌓이지 않음"; exit 1

      - name: 인증 확인 (회원가입 → JWT 발급, 서명 키는 Vault에서)
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:8000/strategies)
          test "$code" = "401" || { echo "로그인 없이 접근 가능 ($code)"; exit 1; }
          token=$(curl -sf -X POST http://localhost:8000/auth/register -H "Content-Type: application/json" \
                  -d '{"username":"ci_user","password":"ci-password-123"}' | python3 -c "import sys,json;print(json.load(sys.stdin)['access_token'])")
          echo "AUTH=Authorization: Bearer $token" >> "$GITHUB_ENV"
          curl -sf http://localhost:8000/auth/me -H "Authorization: Bearer $token" | grep -q ci_user
          docker compose logs backend | grep "JWT 서명 키 출처: vault"
          docker compose exec -T vault sh -c 'VAULT_ADDR=http://127.0.0.1:8200 VAULT_TOKEN=dev-root-token vault kv get -field=jwt_secret secret/trading' > /dev/null

      - name: 자동매매 엔진 확인 (전략 등록 → 조건 충족 → 모의 주문 → Postgres 저장)
        run: |
          curl -sf -X POST http://localhost:8000/strategies \
            -H "Content-Type: application/json" -H "$AUTH" \
            -d '{"name":"CI 테스트 전략","symbol":"005930","side":"buy","quantity":1,"cooldown_sec":5,
                 "conditions":[{"left":{"name":"PRICE"},"op":">","right":0}]}'
          for i in $(seq 1 20); do
            res=$(curl -s http://localhost:8000/orders -H "$AUTH" || true)
            echo "$res" | head -c 300; echo
            if echo "$res" | grep -q '"FILLED"'; then exit 0; fi
            sleep 3
          done
          echo "모의 주문이 실행되지 않음"; exit 1

      - name: 가상계좌 연결 확인 (가입 시 계좌 개설 → 자동 주문 체결 → 현금·보유 종목 반영)
        run: |
          curl -sf http://localhost:8000/edu/account -H "$AUTH" | python3 -c "
          import sys, json
          a = json.load(sys.stdin)
          print('현금', a['cash'], '보유', [(p['symbol'], p['quantity']) for p in a['positions']])
          assert a['initial_cash'] == 10_000_000, '가입 시 1,000만 원 계좌가 없음'
          assert a['cash'] < a['initial_cash'], '자동 주문 후 현금이 줄지 않음'
          assert any(p['symbol'] == '005930' and p['quantity'] >= 1 for p in a['positions']), '보유 종목에 없음'
          assert any(t['strategy_id'] is not None and t['strategy_name'] == 'CI 테스트 전략' for t in a['trades']), '자동매매 거래로 표시되지 않음'
          assert any(s['auto'] and s['buys'] >= 1 for s in a['strategy_stats']), '전략별 성과에 없음'
          "

      - name: 가상계좌 주문 거부 확인 (보유하지 않은 종목 매도 전략 → REJECTED)
        run: |
          curl -sf -X POST http://localhost:8000/strategies \
            -H "Content-Type: application/json" -H "$AUTH" \
            -d '{"name":"CI 거부 전략","symbol":"000660","side":"sell","quantity":1,"cooldown_sec":60,
                 "conditions":[{"left":{"name":"PRICE"},"op":">","right":0}]}'
          for i in $(seq 1 20); do
            res=$(curl -s http://localhost:8000/orders -H "$AUTH" || true)
            if echo "$res" | python3 -c "
          import sys, json
          o = [x for x in json.load(sys.stdin) if x['strategy_name'] == 'CI 거부 전략']
          print(o[:1])
          sys.exit(0 if o and o[0]['status'] == 'REJECTED' and '보유 수량' in o[0]['reason']['reject_reason'] else 1)
          "; then exit 0; fi
            sleep 3
          done
          echo "잔고 확인(주문 거부)이 동작하지 않음"; exit 1

      - name: AI 실시간 이상탐지 확인 (kafka → ai → redis → backend /anomalies)
        run: |
          for i in $(seq 1 30); do
            res=$(curl -s http://localhost:8000/anomalies || true)
            echo "$res" | head -c 400; echo
            if echo "$res" | grep -q '"anomaly"'; then exit 0; fi
            sleep 5
          done
          echo "이상탐지 경보가 생성되지 않음"; docker compose logs ai | tail -50; exit 1

      - name: 타임머신 확인 (과거 시세 → 백테스트, 직접 매매 세션 → ai 이상거래 표시)
        run: |
          curl -sf http://localhost:8000/history/symbols | grep -q '"count"'
          presets=$(curl -sf http://localhost:8000/backtest/presets)
          body=$(echo "$presets" | python3 -c "import sys,json;p=json.load(sys.stdin)[0];print(json.dumps({'symbol':'005930','start':'2024-01-02','buy_conditions':p['buy_conditions'],'sell_conditions':p['sell_conditions']}))")
          curl -sf -X POST http://localhost:8000/backtest -H "Content-Type: application/json" -d "$body" | grep -q '"total_return_pct"'
          sid=$(curl -sf -X POST http://localhost:8000/timemachine/sessions -H "Content-Type: application/json" -H "$AUTH" \
                -d '{"symbol":"005380","start_date":"2024-03-04"}' | python3 -c "import sys,json;print(json.load(sys.stdin)['id'])")
          curl -sf -X POST http://localhost:8000/timemachine/sessions/$sid/order -H "Content-Type: application/json" -H "$AUTH" -d '{"side":"buy","quantity":3}' > /dev/null
          curl -sf -X POST http://localhost:8000/timemachine/sessions/$sid/step -H "Content-Type: application/json" -H "$AUTH" -d '{"days":30}' \
            | python3 -c "import sys,json;v=json.load(sys.stdin);print(v['date'],'anomalies',len(v['anomalies']));assert v['days_passed']==30"
          curl -sf -X POST http://localhost:8000/timemachine/sessions/$sid/finish -H "$AUTH" | grep -q '"ranking"'

      - name: frontend → backend 프록시 확인
        run: curl -sf http://localhost:3000/api/health

      - name: AI 이상탐지 API 확인
        run: |
          curl -sf -X POST http://localhost:8001/detect \
            -H "Content-Type: application/json" \
            -d '{"bars":[{"timestamp":"a","price":100,"volume":1},{"timestamp":"b","price":110,"volume":1}]}' \
            | grep -q price_jump

      - name: 실패 시 로그 출력
        if: failure()
        run: docker compose logs

      - name: 정리
        if: always()
        run: docker compose down -v
