name: Integration Test

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  compose-up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 전체 컨테이너 실행
        run: docker compose up -d --build

      - name: 컨테이너 간 통신 확인 (backend → kafka, redis, postgres, vault, ai)
        run: |
          for i in $(seq 1 30); do
            res=$(curl -s http://localhost:8000/health/deps || true)
            echo "$res"
            if echo "$res" | grep -q '"status":"ok"'; then exit 0; fi
            sleep 5
          done
          echo "의존 서비스 연결 실패"; exit 1

      - name: 시세 파이프라인 확인 (collector → kafka → backend → redis)
        run: |
          for i in $(seq 1 30); do
            res=$(curl -s http://localhost:8000/market/prices || true)
            echo "$res" | head -c 300; echo
            if echo "$res" | grep -q '"symbol"'; then exit 0; fi
            sleep 5
          done
          echo "시세 데이터가 Redis에 쌓이지 않음"; exit 1

      - name: 자동매매 엔진 확인 (전략 등록 → 조건 충족 → 모의 주문 → Postgres 저장)
        run: |
          curl -sf -X POST http://localhost:8000/strategies \
            -H "Content-Type: application/json" \
            -d '{"name":"CI 테스트 전략","symbol":"005930","side":"buy","quantity":1,"cooldown_sec":5,
                 "conditions":[{"left":{"name":"PRICE"},"op":">","right":0}]}'
          for i in $(seq 1 20); do
            res=$(curl -s http://localhost:8000/orders || true)
            echo "$res" | head -c 300; echo
            if echo "$res" | grep -q '"FILLED"'; then exit 0; fi
            sleep 3
          done
          echo "모의 주문이 실행되지 않음"; exit 1

      - name: frontend → backend 프록시 확인
        run: curl -sf http://localhost:3000/api/health

      - name: AI 이상탐지 API 확인
        run: |
          curl -sf -X POST http://localhost:8001/detect \
            -H "Content-Type: application/json" \
            -d '{"bars":[{"timestamp":"a","price":100,"volume":1},{"timestamp":"b","price":110,"volume":1}]}' \
            | grep -q price_jump

      - name: 실패 시 로그 출력
        if: failure()
        run: docker compose logs

      - name: 정리
        if: always()
        run: docker compose down -v
