name: Integration Test

on:
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

jobs:
  compose-up:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 전체 컨테이너 실행
        run: docker compose up -d --build

      - name: 컨테이너 간 통신 확인 (backend → kafka, redis, postgres, vault, ai)
        run: |
          for i in $(seq 1 30); do
            res=$(curl -s http://localhost:8000/health/deps || true)
            echo "$res"
            if echo "$res" | grep -q '"status":"ok"'; then exit 0; fi
            sleep 5
          done
          echo "의존 서비스 연결 실패"; exit 1

      - name: frontend → backend 프록시 확인
        run: curl -sf http://localhost:3000/api/health

      - name: AI 이상탐지 API 확인
        run: |
          curl -sf -X POST http://localhost:8001/detect \
            -H "Content-Type: application/json" \
            -d '{"bars":[{"timestamp":"a","price":100,"volume":1},{"timestamp":"b","price":110,"volume":1}]}' \
            | grep -q price_jump

      - name: 실패 시 로그 출력
        if: failure()
        run: docker compose logs

      - name: 정리
        if: always()
        run: docker compose down -v
