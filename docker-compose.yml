# 컨테이너 8종: frontend, backend, collector, ai, kafka, redis, postgres, vault
# 모든 컨테이너는 trading-net 네트워크에서 서비스 이름으로 서로 통신한다.
#   collector ──시세──> kafka(stock.price) ──> backend ──> redis(캐시)
#                                          └──> ai(이상탐지) ──> kafka(stock.anomaly), redis(경보)
#   frontend(nginx) ──/api──> backend ──> postgres, vault, ai

services:
  frontend:
    build: ./frontend
    container_name: frontend
    ports:
      - "3000:80"
    depends_on:
      - backend
    networks: [trading-net]

  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://${POSTGRES_USER:-trader}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-trading}
      VAULT_ADDR: http://vault:8200
      AI_SERVICE_URL: http://ai:8001
    depends_on:
      - kafka
      - redis
      - postgres
      - vault
      - ai
    networks: [trading-net]

  collector:
    build: ./backend
    container_name: collector
    command: ["python", "-m", "app.market.collector"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      MARKET_SOURCE: ${MARKET_SOURCE:-mock}
    env_file:
      - path: .env
        required: false
    depends_on:
      - kafka
    restart: unless-stopped
    networks: [trading-net]

  ai:
    build: ./ai
    container_name: ai
    ports:
      - "8001:8001"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      REDIS_URL: redis://redis:6379/0
      MODEL_DIR: /app/models
    volumes:
      - ai-models:/app/models          # 학습된 이상탐지 모델(LOF) 저장
    depends_on:
      - kafka
      - redis
    networks: [trading-net]

  kafka:
    image: apache/kafka:3.8.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks: [trading-net]

  redis:
    image: redis:7.4-alpine
    container_name: redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks: [trading-net]

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trader}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      POSTGRES_DB: ${POSTGRES_DB:-trading}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks: [trading-net]

  vault:
    image: hashicorp/vault:1.17
    container_name: vault
    ports:
      - "8200:8200"
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-dev-root-token}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    cap_add:
      - IPC_LOCK
    networks: [trading-net]

networks:
  trading-net:

volumes:
  pg-data:
  redis-data:
  kafka-data:
  ai-models:
